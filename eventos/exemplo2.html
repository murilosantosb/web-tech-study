<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Eventos JavaScript</h1>

    <button id="btnMensagem">
        Clique aqui
    </button>

    <script>
        let btn = document.querySelector("#btnMensagem")

        const enviarNotificacao = () => {
            alert("Hello World!");
        }

         btn.addEventListener("click", (e) => {
                e.preventDefault();  
                enviarNotificacao(); 
        })

    </script>
</body>
</html>
